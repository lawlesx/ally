<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ally">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Ally</title>
<style>
  :root {
    --bg: #14110f;
    --text: #efe6dc;
    --muted: #9a8d80;
    --warm: #ffb27a;
    --rose: #f2798f;
    --cool: #8fb8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #221b17 0%, var(--bg) 70%);
    color: var(--text);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: grid;
    justify-items: center;
    gap: 48px;
    padding: 16px;
    text-align: center;
  }
  #orb {
    --level: 0;
    --size: min(52vw, 240px);
    width: var(--size);
    height: var(--size);
    border: 0;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffe3c7 0%, var(--warm) 38%, var(--rose) 100%);
    transform: scale(calc(1 + var(--level) * 0.35));
    box-shadow:
      0 0 calc(40px + var(--level) * 140px) calc(var(--level) * 30px) rgb(255 150 110 / 0.45),
      inset 0 -18px 40px rgb(120 30 50 / 0.35);
    transition: filter 0.6s ease, opacity 0.6s ease, background 0.6s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #orb:focus-visible { outline: 2px solid var(--text); outline-offset: 10px; }

  body[data-state="idle"] #orb {
    filter: saturate(0.55) brightness(0.8);
    animation: rest 5s ease-in-out infinite;
  }
  body[data-state="connecting"] #orb {
    filter: saturate(0.7);
    animation: rest 1.1s ease-in-out infinite;
    cursor: progress;
  }
  body[data-state="listening"] #orb {
    background: radial-gradient(circle at 35% 30%, #eef4ff 0%, var(--cool) 42%, #7a6fd6 100%);
    box-shadow:
      0 0 calc(40px + var(--level) * 140px) calc(var(--level) * 30px) rgb(130 160 255 / 0.4),
      inset 0 -18px 40px rgb(40 30 110 / 0.35);
  }
  @keyframes rest {
    0%, 100% { opacity: 0.85; scale: 1; }
    50% { opacity: 1; scale: 1.04; }
  }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #label {
    min-height: 1.5em;
    margin: 0;
    max-width: 32ch;
    color: var(--muted);
  }
  #lock { display: flex; gap: 8px; margin-top: -24px; }
  #lock[hidden] { display: none; }
  #lock input, #lock button {
    font: inherit;
    color: var(--text);
    border-radius: 999px;
    border: 1px solid rgb(255 255 255 / 0.16);
    background: rgb(255 255 255 / 0.06);
    padding: 10px 16px;
    min-height: 44px;
  }
  #lock input { width: min(52vw, 220px); text-align: center; }
  #lock input:focus-visible, #lock button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #lock button { cursor: pointer; background: rgb(255 255 255 / 0.14); }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  @media (prefers-reduced-motion: reduce) {
    #orb { animation: none !important; transform: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>Ally</h1>
    <button id="orb" type="button"></button>
    <p id="label" role="status" aria-live="polite"></p>
    <form id="lock" hidden>
      <input id="passcode" type="password" aria-label="Passcode" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button type="submit">Unlock</button>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
